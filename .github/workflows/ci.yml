name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_VERSION: 10.0.x
  TEST_FLAGS: --configuration Release --no-restore --logger trx --results-directory TestResults

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore BankingApp/src/BankingApp.Api/BankingApp.Api.csproj

      - name: Build
        run: dotnet build BankingApp/src/BankingApp.Api/BankingApp.Api.csproj --no-restore --configuration Release

  backend-tests:
    needs: build
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Test@1234Pass
          MSSQL_SA_PASSWORD: Test@1234Pass
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P 'Test@1234Pass' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      MSSQL_CONNECTION_STRING: "Server=localhost,1433;Database=BankingAppIntegrationTests;User Id=sa;Password=Test@1234Pass;TrustServerCertificate=True;"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore domain tests
        run: dotnet restore BankingApp/tests/BankingApp.Domain.Tests/BankingApp.Domain.Tests.csproj

      - name: Restore application tests
        run: dotnet restore BankingApp/tests/BankingApp.Application.Tests/BankingApp.Application.Tests.csproj

      - name: Restore infrastructure tests
        run: dotnet restore BankingApp/tests/BankingApp.Infrastructure.Tests/BankingApp.Infrastructure.Tests.csproj

      - name: Restore infrastructure integration tests
        run: dotnet restore BankingApp/tests/BankingApp.Infrastructure.Tests.Integration/BankingApp.Infrastructure.Tests.Integration.csproj

      - name: Restore API tests
        run: dotnet restore BankingApp/tests/BankingApp.Api.Tests/BankingApp.Api.Tests.csproj

      - name: Restore API integration tests
        run: dotnet restore BankingApp/tests/BankingApp.Api.Tests.Integration/BankingApp.Api.Tests.Integration.csproj

      - name: Run domain tests
        run: dotnet test BankingApp/tests/BankingApp.Domain.Tests/BankingApp.Domain.Tests.csproj ${{ env.TEST_FLAGS }}

      - name: Run application tests
        run: dotnet test BankingApp/tests/BankingApp.Application.Tests/BankingApp.Application.Tests.csproj ${{ env.TEST_FLAGS }}

      - name: Run infrastructure tests
        run: dotnet test BankingApp/tests/BankingApp.Infrastructure.Tests/BankingApp.Infrastructure.Tests.csproj ${{ env.TEST_FLAGS }}

      - name: Run infrastructure integration tests
        run: dotnet test BankingApp/tests/BankingApp.Infrastructure.Tests.Integration/BankingApp.Infrastructure.Tests.Integration.csproj ${{ env.TEST_FLAGS }}

      - name: Run API tests
        run: dotnet test BankingApp/tests/BankingApp.Api.Tests/BankingApp.Api.Tests.csproj ${{ env.TEST_FLAGS }}

      - name: Run API integration tests
        run: dotnet test BankingApp/tests/BankingApp.Api.Tests.Integration/BankingApp.Api.Tests.Integration.csproj ${{ env.TEST_FLAGS }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api
          path: '**/TestResults/*.trx'

  desktop-frontend-tests:
    runs-on: windows-latest
    env:
      DESKTOP_TEST_PROJECT: BankingApp/tests/BankingApp.Desktop.Tests/BankingApp.Desktop.Tests.csproj
      DESKTOP_TEST_MSBUILD_PROPS: >
        /p:RuntimeIdentifier=win-x64
        /p:PlatformTarget=x64
        /p:WindowsPackageType=None
        /p:WindowsAppSDKSelfContained=true
        /p:WindowsAppSdkUndockedRegFreeWinRTInitialize=false
        /p:PublishReadyToRun=false
        /p:PublishTrimmed=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore desktop tests
        shell: pwsh
        run: |
          $msbuildProps = $env:DESKTOP_TEST_MSBUILD_PROPS -split '\s+'
          dotnet restore $env:DESKTOP_TEST_PROJECT @msbuildProps

      - name: Build desktop tests
        shell: pwsh
        run: |
          $msbuildProps = $env:DESKTOP_TEST_MSBUILD_PROPS -split '\s+'
          dotnet build $env:DESKTOP_TEST_PROJECT --no-restore --configuration Debug @msbuildProps

      - name: Run desktop tests
        shell: pwsh
        timeout-minutes: 10
        run: |
          $msbuildProps = $env:DESKTOP_TEST_MSBUILD_PROPS -split '\s+'
          New-Item -ItemType Directory -Force -Path TestResults
          dotnet test $env:DESKTOP_TEST_PROJECT --no-build --configuration Debug @msbuildProps --logger "trx;LogFileName=desktop-tests.trx" --results-directory TestResults --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none
          Get-ChildItem -Path TestResults -Recurse

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-desktop
          path: |
            '**/TestResults/*.trx'
            '**/TestResults/**/Sequence_*.xml'
